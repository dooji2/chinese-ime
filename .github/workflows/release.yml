# Builds the mod on every push to the default branch and republishes the
# jar to a rolling "latest" GitHub release.

name: release

on:
  push:
    branches:
      - '**'

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup jdk 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: |
            Automated build from the latest push to `${{ github.ref_name }}` (${{ github.sha }}).
          prerelease: false
          make_latest: true
          files: build/libs/*.jar
